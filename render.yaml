services:
  # FastAPI Backend
  - type: web
    name: resume-ats-backend
    runtime: docker
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: KEYWORD_SCORE_WEIGHT
        value: "0.6"
      - key: FORMATTING_SCORE_WEIGHT
        value: "0.4"

  # Static Frontend
  - type: web
    name: resume-ats-frontend
    runtime: static
    rootDir: .
    buildCommand: ""
    staticPublishPath: ./frontend
